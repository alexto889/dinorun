<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Orange Dino Run</title>
<style>
  :root { --navy:#2d1b4e; --cream:#fff3dc; --orange:#ffa31a; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:12px; background:var(--navy); color:var(--cream);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  h1 { margin:0; font-size:clamp(20px,4vw,30px); letter-spacing:.05em; }
  h1 span { color:var(--orange); }
  canvas {
    display:block; width:min(96vw,860px); height:auto; background:#ffb86b;
    border-radius:18px; border:4px solid var(--orange); box-shadow:0 10px 0 #1a0f30;
    touch-action:manipulation;
  }
  .controls { display:flex; gap:12px; }
  button {
    font:inherit; font-weight:700; font-size:16px; padding:12px 30px; border-radius:14px;
    border:3px solid var(--cream); background:var(--orange); color:var(--navy);
    cursor:pointer; touch-action:manipulation; box-shadow:0 5px 0 #1a0f30;
  }
  button:active { transform:translateY(3px); box-shadow:0 2px 0 #1a0f30; }
  .legend { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; font-size:13px; }
  .legend span { padding:5px 12px; border-radius:999px; background:rgba(255,243,220,.14); }
  .hint { margin:0; font-size:13px; opacity:.85; text-align:center; }
  .scoreform { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .scoreform[hidden] { display:none; }
  .scoreform input {
    font:inherit; font-size:16px; padding:11px 14px; border-radius:12px; width:190px;
    border:3px solid var(--orange); background:var(--cream); color:var(--navy);
  }
  .scoreform button { padding:10px 22px; }
  .scoreform button:disabled { opacity:.6; cursor:default; }
  #saveMsg { font-size:14px; min-width:150px; }
  .board {
    width:min(96vw,420px); background:rgba(255,243,220,.1); border:2px solid var(--orange);
    border-radius:16px; padding:14px 18px 10px;
  }
  .board h2 { margin:0 0 8px; font-size:18px; text-align:center; color:var(--orange); letter-spacing:.05em; }
  .board table { width:100%; border-collapse:collapse; font-size:14px; }
  .board th { text-align:left; font-weight:700; opacity:.7; padding:4px 6px; border-bottom:1px solid rgba(255,243,220,.25); }
  .board td { padding:5px 6px; }
  .board th:nth-child(4), .board td:nth-child(4) { text-align:right; font-variant-numeric:tabular-nums; }
  .board tbody tr:nth-child(1) td { color:var(--orange); font-weight:700; }
  .board p { margin:8px 0 2px; }
  .authbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; min-height:44px; }
  .authbar [hidden], .panel[hidden] { display:none; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
  input, select {
    font:inherit; font-size:15px; padding:9px 12px; border-radius:12px; width:150px;
    border:3px solid var(--orange); background:var(--cream); color:var(--navy);
    user-select:text; -webkit-user-select:text;
  }
  button.small { font-size:14px; padding:8px 16px; box-shadow:0 3px 0 #1a0f30; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { font-size:13px; min-height:1.2em; }
  .panel {
    width:min(96vw,520px); background:rgba(255,243,220,.1); border:2px solid var(--orange);
    border-radius:16px; padding:14px 18px 12px;
  }
  .panel h2 { margin:0 0 10px; font-size:16px; text-align:center; color:var(--orange); letter-spacing:.05em; }
  .panel table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  .panel th { text-align:left; opacity:.7; padding:4px 6px; border-bottom:1px solid rgba(255,243,220,.25); }
  .panel td { padding:4px 6px; }
</style>
</head>
<body>
<h1>ORANGE <span>DINO</span> RUN</h1>
<div class="authbar" id="authBar">
  <form id="loginForm" class="row">
    <input id="loginUser" placeholder="Username" autocomplete="username" maxlength="16" aria-label="Username">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <button id="loginBtn" class="small" type="submit">Sign in</button>
  </form>
  <div id="signedIn" class="row" hidden>
    <span id="whoami"></span>
    <button id="accountBtn" class="small" type="button">Account</button>
    <button id="logoutBtn" class="small" type="button">Sign out</button>
  </div>
  <span id="authMsg" class="msg" role="status"></span>
</div>
<canvas id="c" width="800" height="260" aria-label="Orange Dino Run game"></canvas>
<form id="scoreForm" class="scoreform" hidden>
  <span id="saveWho"></span>
  <button id="saveBtn" type="submit">Save score</button>
  <span id="saveMsg" role="status"></span>
</form>
<div class="controls">
  <button id="jumpBtn" type="button">Jump</button>
  <button id="duckBtn" type="button">Duck</button>
</div>
<div class="legend">
  <span>Level 1: 0&ndash;299</span>
  <span>Level 2: 300&ndash;999</span>
  <span>Level 3: 1000+ (birds!)</span>
</div>
<p class="hint">Space / Up arrow / tap to jump &middot; hold Down arrow to duck</p>
<section class="board" aria-label="Leaderboard">
  <h2>TOP 10</h2>
  <table>
    <thead><tr><th>#</th><th>Player</th><th>Level</th><th>Score</th></tr></thead>
    <tbody id="boardBody"></tbody>
  </table>
  <p id="boardStatus" class="hint">Loading&hellip;</p>
</section>

<section id="accountPanel" class="panel" hidden aria-label="Account">
  <h2>YOUR ACCOUNT</h2>
  <form id="passwordForm" class="row">
    <input id="newPass" type="password" placeholder="New password" autocomplete="new-password" aria-label="New password">
    <button class="small" type="submit">Change password</button>
  </form>
  <p id="passMsg" class="msg hint" role="status"></p>
</section>

<section id="adminPanel" class="panel" hidden aria-label="User management">
  <h2>USER MANAGEMENT (ADMIN)</h2>
  <form id="addUserForm" class="row">
    <input id="newUser" placeholder="Username" maxlength="16" autocomplete="off" aria-label="New username">
    <input id="newName" placeholder="Display name" maxlength="30" autocomplete="off" aria-label="Display name">
    <input id="newUserPass" type="password" placeholder="Initial password" autocomplete="new-password" aria-label="Initial password">
    <select id="newRole" aria-label="Role"><option value="player">Player</option><option value="admin">Admin</option></select>
    <button class="small" type="submit">Add user</button>
  </form>
  <p id="adminMsg" class="msg hint" role="status"></p>
  <table>
    <thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Added</th></tr></thead>
    <tbody id="userBody"></tbody>
  </table>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = c.width, H = c.height, GROUND = 214;
const FONT = '"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const NAVY = '#2d1b4e', CREAM = '#fff3dc', ORANGE = '#ffa31a', ORANGE_D = '#e8760a';
const GREEN = '#38b24a', GREEN_L = '#8ff08a', PINK = '#ff7fa3', PURPLE = '#6b3fd4', GOLD = '#ffd23f';

/* ---------- Levels ---------- */
const levelOf = s => s < 300 ? 1 : s < 1000 ? 2 : 3;
function speedFor(s) {
  if (s < 300) return 6 + (s / 300) * 2;                         // Level 1: 6 -> 8
  if (s < 1000) return 8 + ((s - 300) / 700) * 3;                // Level 2: 8 -> 11
  return 11 + Math.min(1, (s - 1000) / 1000) * 4;                // Level 3: 11 -> 15
}
const THEMES = [
  { top:[255,214,150], bot:[255,166,77], ground:[224,122,31], hill:[255,140,50] },
  { top:[255,184,110], bot:[255,128,36], ground:[201,96,12],  hill:[240,110,25] },
  { top:[255,150,70],  bot:[255,92,15],  ground:[168,66,0],   hill:[225,80,10]  }
];
const cur = JSON.parse(JSON.stringify(THEMES[0]));
const rgb = (a, al = 1) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
const BANNERS = {
  2: ['LEVEL 2', 'Faster, with double cacti!'],
  3: ['LEVEL 3', 'Birds ahead! Hold ↓ to duck']
};

/* ---------- State ---------- */
let hi = 0;
try { hi = +localStorage.getItem('dinoHi') || 0; } catch (e) {}

const keys = { down:false };
const dino = { x:60, feet:GROUND, vy:0, onGround:true, h:56, ducking:false };
let obstacles, clouds, speed, score, frame, running, over, overDelay, nextSpawn, level, banner, scroll, t = 0;

function reset() {
  dino.feet = GROUND; dino.vy = 0; dino.onGround = true; dino.h = 56; dino.ducking = false;
  obstacles = []; speed = 6; score = 0; frame = 0; level = 1; scroll = 0;
  over = false; overDelay = 0; running = true; nextSpawn = 55;
  banner = { text:'', sub:'', life:0 };
  hideSubmit();
  clouds =[{ x:180, y:58 }, { x:470, y:86 }, { x:720, y:48 }];
}
reset(); running = false;

/* ---------- Input ---------- */
function jump() {
  if (over) { if (overDelay <= 0) reset(); return; }
  if (!running) running = true;
  if (dino.onGround) { dino.vy = -12.5; dino.onGround = false; }
}
addEventListener('keydown', e => {
  if (e.target && ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;   // let people type in forms
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' || e.code === 'ArrowUp') { if (!(e.repeat && over)) jump(); }
  if (e.code === 'ArrowDown') keys.down = true;
});
addEventListener('keyup', e => { if (e.code === 'ArrowDown') keys.down = false; });
addEventListener('blur', () => { keys.down = false; });
c.addEventListener('pointerdown', jump);
const jumpBtn = document.getElementById('jumpBtn'), duckBtn = document.getElementById('duckBtn');
jumpBtn.addEventListener('pointerdown', jump);
duckBtn.addEventListener('pointerdown', () => { keys.down = true; if (!running && !over) running = true; });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => duckBtn.addEventListener(ev, () => { keys.down = false; }));

/* ---------- Obstacles ---------- */
function makeCactus(count) {
  const parts = [];
  for (let i = 0; i < count; i++) parts.push({ dx:i * 24, h:34 + Math.floor(Math.random() * 22), flower:Math.random() < 0.35 });
  return { type:'cactus', x:W + 20, parts, w:24 * (count - 1) + 16 };
}
function spawn() {
  const r = Math.random();
  if (level === 1) obstacles.push(makeCactus(1));
  else if (level === 2) obstacles.push(makeCactus(r < 0.32 ? 2 : 1));
  else if (r < 0.28) {
    const low = Math.random() < 0.5;
    obstacles.push({ type:'bird', x:W + 20, y:low ? GROUND - 32 : GROUND - 74, w:44, low });
  } else obstacles.push(makeCactus(r < 0.5 ? 3 : r < 0.75 ? 2 : 1));
  nextSpawn = 44 + Math.random() * 36;
}

/* ---------- Drawing helpers ---------- */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fs(fill, lw = 3) {
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = lw; ctx.strokeStyle = NAVY; ctx.lineJoin = 'round'; ctx.stroke();
}
function drawEye(ex, ey, dead, blink) {
  ctx.strokeStyle = NAVY; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  if (dead) {
    ctx.beginPath(); ctx.moveTo(ex - 3.5, ey - 3.5); ctx.lineTo(ex + 3.5, ey + 3.5);
    ctx.moveTo(ex + 3.5, ey - 3.5); ctx.lineTo(ex - 3.5, ey + 3.5); ctx.stroke();
  } else if (blink) {
    ctx.beginPath(); ctx.moveTo(ex - 4, ey); ctx.lineTo(ex + 4, ey); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI * 2); fs('#fff', 2);
    ctx.fillStyle = NAVY; ctx.beginPath(); ctx.arc(ex + 1.5, ey + 0.8, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + 2.5, ey - 0.4, 1.1, 0, Math.PI * 2); ctx.fill();
  }
}
function drawFace(ex, ey, cx, cy, mx, my, nx, ny, dead, blink) {
  drawEye(ex, ey, dead, blink);
  ctx.fillStyle = 'rgba(255,127,163,.85)';
  ctx.beginPath(); ctx.ellipse(cx, cy, 3.8, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (dead) { ctx.moveTo(mx - 3, my + 1); ctx.lineTo(mx + 3, my + 1); }
  else ctx.arc(mx, my - 1, 3.6, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  ctx.fillStyle = NAVY; ctx.beginPath(); ctx.arc(nx, ny, 1.1, 0, Math.PI * 2); ctx.fill();
}

/* ---------- Dino (original cute design) ---------- */
function drawDino(x, top, ducking, stepFrame, dead, blink) {
  ctx.save(); ctx.translate(x, top);
  const l1 = stepFrame ? 0 : 4, l2 = stepFrame ? 4 : 0;
  if (!ducking) {
    ctx.beginPath(); ctx.moveTo(12, 28); ctx.quadraticCurveTo(0, 30, -8, 44); ctx.quadraticCurveTo(6, 46, 16, 42); ctx.closePath(); fs(ORANGE);
    rr(14, 40, 10, 16 - l1, 4); fs(ORANGE);
    rr(30, 40, 10, 16 - l2, 4); fs(ORANGE);
    for (let i = 0; i < 3; i++) {
      const sx = 11 + i * 8;
      ctx.beginPath(); ctx.moveTo(sx, 25); ctx.lineTo(sx + 4, 13); ctx.lineTo(sx + 8, 25); ctx.closePath(); fs(ORANGE_D, 2.5);
    }
    rr(8, 20, 34, 28, 13); fs(ORANGE);
    rr(24, 30, 14, 16, 7); ctx.fillStyle = CREAM; ctx.fill();
    rr(36, 34, 9, 5, 2.5); fs(ORANGE, 2.5);
    rr(24, 0, 28, 24, 11); fs(ORANGE);
    drawFace(41, 10, 37, 18, 46, 17, 49, 7, dead, blink);
  } else {
    ctx.beginPath(); ctx.moveTo(10, 14); ctx.quadraticCurveTo(0, 16, -8, 26); ctx.quadraticCurveTo(6, 28, 14, 26); ctx.closePath(); fs(ORANGE);
    rr(14, 22, 9, 10 - l1, 4); fs(ORANGE);
    rr(32, 22, 9, 10 - l2, 4); fs(ORANGE);
    for (let i = 0; i < 3; i++) {
      const sx = 9 + i * 8;
      ctx.beginPath(); ctx.moveTo(sx, 12); ctx.lineTo(sx + 4, 3); ctx.lineTo(sx + 8, 12); ctx.closePath(); fs(ORANGE_D, 2.5);
    }
    rr(6, 8, 40, 20, 10); fs(ORANGE);
    rr(24, 16, 16, 10, 5); ctx.fillStyle = CREAM; ctx.fill();
    rr(34, 0, 26, 20, 10); fs(ORANGE);
    drawFace(50, 8, 45, 14, 54, 13, 57, 5, dead, blink);
  }
  ctx.restore();
}

/* ---------- Cactus ---------- */
function drawCactusPart(x, h, flower) {
  const base = GROUND;
  rr(x - 9, base - h * 0.55, 12, 7, 3.5); fs(GREEN, 2.5);
  rr(x - 9, base - h * 0.55 - 14, 7, 21, 3.5); fs(GREEN, 2.5);
  rr(x + 13, base - h * 0.4, 12, 7, 3.5); fs(GREEN, 2.5);
  rr(x + 18, base - h * 0.4 - 12, 7, 19, 3.5); fs(GREEN, 2.5);
  rr(x, base - h, 16, h, 8); fs(GREEN);
  rr(x + 4, base - h + 7, 3, h - 16, 1.5); ctx.fillStyle = GREEN_L; ctx.fill();
  if (flower) {
    ctx.beginPath(); ctx.arc(x + 8, base - h - 1, 5, 0, Math.PI * 2); fs(PINK, 2);
    ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(x + 8, base - h - 1, 1.8, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------- Bird ---------- */
function drawBird(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  const up = Math.floor(t / 8) % 2 === 0;
  ctx.beginPath();
  if (up) { ctx.moveTo(12, 14); ctx.lineTo(22, -6); ctx.lineTo(32, 14); }
  else { ctx.moveTo(12, 20); ctx.lineTo(22, 38); ctx.lineTo(32, 20); }
  ctx.closePath(); fs('#8a63ff', 2.5);
  rr(6, 10, 30, 16, 8); fs(PURPLE);
  ctx.beginPath(); ctx.moveTo(35, 14); ctx.lineTo(48, 18); ctx.lineTo(35, 22); ctx.closePath(); fs(GOLD, 2.5);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(30, 16, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = NAVY; ctx.beginPath(); ctx.arc(31, 16.5, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ---------- Update ---------- */
function overlap(a, b) { return a.r > b.l && a.l < b.r && a.b > b.t && a.t < b.b; }
function dinoBox() {
  const top = dino.feet - dino.h;
  return dino.ducking
    ? { l:dino.x + 4, r:dino.x + 56, t:top + 4, b:dino.feet }
    : { l:dino.x + 8, r:dino.x + 48, t:top + 4, b:dino.feet };
}
function collides() {
  const d = dinoBox();
  for (const o of obstacles) {
    if (o.type === 'cactus') {
      for (const p of o.parts) {
        if (overlap(d, { l:o.x + p.dx - 4, r:o.x + p.dx + 20, t:GROUND - p.h, b:GROUND })) return true;
      }
    } else if (overlap(d, { l:o.x + 6, r:o.x + 40, t:o.y + 8, b:o.y + 26 })) return true;
  }
  return false;
}
function endGame() {
  over = true; overDelay = 30;
  if (Math.floor(score) > hi) {
    hi = Math.floor(score);
    try { localStorage.setItem('dinoHi', hi); } catch (e) {}
  }
  showSubmit();
}
function update() {
  t++;
  const tg = THEMES[level - 1];
  for (const k in cur) for (let i = 0; i < 3; i++) cur[k][i] += (tg[k][i] - cur[k][i]) * 0.04;
  if (over && overDelay > 0) overDelay--;
  if (!running || over) return;

  frame++;
  speed = speedFor(score);
  score += speed * 0.03;
  scroll += speed;

  const lv = levelOf(score);
  if (lv !== level) { level = lv; banner = { text:BANNERS[lv][0], sub:BANNERS[lv][1], life:130 }; }
  if (banner.life > 0) banner.life--;

  dino.ducking = keys.down && dino.onGround;
  dino.h = dino.ducking ? 32 : 56;
  if (!dino.onGround && keys.down) dino.vy += 0.9;
  dino.vy += 0.65; dino.feet += dino.vy;
  if (dino.feet >= GROUND) { dino.feet = GROUND; dino.vy = 0; dino.onGround = true; }

  if (--nextSpawn <= 0) spawn();
  obstacles.forEach(o => { o.x -= speed + (o.type === 'bird' ? 1.5 : 0); });
  obstacles = obstacles.filter(o => o.x + (o.w || 50) > -40);
  clouds.forEach(cl => { cl.x -= speed * 0.2; if (cl.x < -70) { cl.x = W + 20; cl.y = 34 + Math.random() * 70; } });

  if (collides()) endGame();
}

/* ---------- Render ---------- */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, rgb(cur.top)); g.addColorStop(1, rgb(cur.bot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const sg = ctx.createRadialGradient(W - 120, 64, 6, W - 120, 64, 60);
  sg.addColorStop(0, 'rgba(255,243,220,.95)'); sg.addColorStop(0.5, 'rgba(255,243,220,.5)'); sg.addColorStop(1, 'rgba(255,243,220,0)');
  ctx.fillStyle = sg; ctx.fillRect(W - 190, 0, 140 + 50, 140);

  [[0.12, 34, 0.5], [0.3, 16, 0.75]].forEach(([par, amp, al]) => {
    ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 8) {
      const s = x + scroll * par;
      ctx.lineTo(x, GROUND - amp - amp * 0.6 * Math.sin(s / 95) - amp * 0.3 * Math.sin(s / 37));
    }
    ctx.lineTo(W, GROUND); ctx.closePath();
    ctx.fillStyle = rgb(cur.hill, al); ctx.fill();
  });

  ctx.fillStyle = 'rgba(255,243,220,.75)';
  clouds.forEach(cl => { rr(cl.x, cl.y, 58, 16, 8); ctx.fill(); rr(cl.x + 10, cl.y - 10, 30, 18, 9); ctx.fill(); });

  ctx.fillStyle = rgb(cur.ground); ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = NAVY; ctx.fillRect(0, GROUND, W, 4);
  ctx.globalAlpha = 0.45;
  for (let i = 0; i < 26; i++) {
    const px = (((i * 83 - scroll) % W) + W) % W;
    ctx.fillRect(px, GROUND + 14 + (i % 4) * 10, 8, 3);
  }
  ctx.globalAlpha = 1;
}

function pill(x, y, w, h, text, align) {
  rr(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(45,27,78,.88)'; ctx.fill();
  ctx.fillStyle = CREAM; ctx.font = `700 15px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(text, align === 'center' ? x + w / 2 : x + 14, y + h / 2 + 1);
}
function outlined(text, x, y, size, lw = 7) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.font = `900 ${size}px ${FONT}`;
  ctx.lineWidth = lw; ctx.strokeStyle = CREAM; ctx.strokeText(text, x, y);
  ctx.fillStyle = NAVY; ctx.fillText(text, x, y);
}

function draw() {
  drawBackground();
  obstacles.forEach(o => {
    if (o.type === 'cactus') o.parts.forEach(p => drawCactusPart(o.x + p.dx, p.h, p.flower));
    else drawBird(o);
  });
  const stepFrame = dino.onGround && running && !over ? Math.floor(frame / 5) % 2 : 0;
  const blink = !over && t % 200 < 8;
  drawDino(dino.x, dino.feet - dino.h, dino.ducking, stepFrame, over, blink);

  // HUD
  pill(14, 12, 112, 28, 'LEVEL ' + level, 'center');
  const prog = level === 1 ? score / 300 : level === 2 ? (score - 300) / 700 : 1;
  rr(14, 46, 112, 8, 4); ctx.fillStyle = 'rgba(45,27,78,.35)'; ctx.fill();
  rr(14, 46, Math.max(8, 112 * Math.min(1, prog)), 8, 4); ctx.fillStyle = NAVY; ctx.fill();
  ctx.fillStyle = NAVY; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.font = `700 20px ${FONT}`;
  ctx.fillText('HI ' + String(hi).padStart(5, '0') + '   ' + String(Math.floor(score)).padStart(5, '0'), W - 16, 34);

  if (!running && !over) {
    outlined('ORANGE DINO RUN', W / 2, 96, 38);
    outlined('Press Space or tap to start', W / 2, 128, 18, 5);
  }
  if (banner.life > 0 && !over) {
    ctx.save(); ctx.globalAlpha = Math.min(1, banner.life / 30);
    outlined(banner.text, W / 2, 92, 46, 8);
    outlined(banner.sub, W / 2, 124, 18, 5);
    ctx.restore();
  }
  if (over) {
    outlined('GAME OVER', W / 2, 92, 44, 8);
    outlined('Level ' + level + ' · Score ' + Math.floor(score), W / 2, 122, 18, 5);
    outlined('Press Space or tap to play again', W / 2, 148, 16, 5);
  }
}

/* ---------- Leaderboard (Supabase) ---------- */
// The publishable key is designed to be public in the browser. What it can do is
// limited by row-level security: anyone can read scores, only signed-in players can
// add their own, and only admins can see the user list or add users.
const SUPABASE_URL = 'https://irfwmclvomqbtdbcijes.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PRy-_DqwPCw2Sl94rzISNw_MNNXJsB_';
const EMAIL_DOMAIN = 'dinorun.example.com';   // usernames map to <username>@dinorun.example.com in Supabase Auth
const sbHeaders = { apikey:SUPABASE_KEY, 'Content-Type':'application/json' };
const byId = id => document.getElementById(id);
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let lastRun = { score:0, level:1 };
let currentProfile = null;   // { id, username, display_name, role } when signed in

async function loadBoard() {
  const body = byId('boardBody'), status = byId('boardStatus');
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/dino_scores?select=player_name,score,level&order=score.desc,created_at.asc&limit=10', { headers:sbHeaders });
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    body.textContent = '';
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      [i + 1, r.player_name, 'L' + r.level, r.score].forEach(v => {
        const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    status.textContent = rows.length ? '' : 'No scores yet. Be the first!';
  } catch (e) {
    status.textContent = "Couldn't load the leaderboard right now.";
  }
}

/* ---------- Score saving (signed-in players only) ---------- */
function renderScoreForm() {
  if (lastRun.score < 1) return;
  const signedIn = !!currentProfile;
  byId('saveWho').textContent = signedIn
    ? 'Save ' + lastRun.score + ' as ' + currentProfile.username + '?'
    : 'Sign in above to save your score to the leaderboard.';
  byId('saveBtn').hidden = !signedIn;
  byId('saveBtn').disabled = false;
  byId('saveMsg').textContent = '';
  byId('scoreForm').hidden = false;
}
function showSubmit() {
  lastRun = { score:Math.floor(score), level };
  renderScoreForm();
}
function hideSubmit() { const f = document.getElementById('scoreForm'); if (f) f.hidden = true; }

byId('scoreForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sb || !currentProfile) { byId('saveMsg').textContent = 'Please sign in first.'; return; }
  byId('saveBtn').disabled = true; byId('saveMsg').textContent = 'Saving…';
  const { error } = await sb.from('dino_scores').insert({
    user_id:currentProfile.id, player_name:currentProfile.username,
    score:lastRun.score, level:lastRun.level
  });
  if (error) {
    byId('saveMsg').textContent = "Couldn't save. Please try again.";
    byId('saveBtn').disabled = false;
  } else {
    byId('saveMsg').textContent = 'Score saved!';
    loadBoard();
  }
});

/* ---------- Sign in / sign out / user management ---------- */
const setText = (id, text) => { byId(id).textContent = text; };

function renderAuth() {
  const p = currentProfile;
  byId('loginForm').hidden = !!p;
  byId('signedIn').hidden = !p;
  byId('accountPanel').hidden = true;
  byId('adminPanel').hidden = !(p && p.role === 'admin');
  if (p) setText('whoami', 'Hi, ' + p.display_name + (p.role === 'admin' ? ' (admin)' : ''));
  if (p && p.role === 'admin') loadUsers();
  if (over) renderScoreForm();
}

async function applySession(session) {
  if (!session) { currentProfile = null; renderAuth(); return; }
  const { data } = await sb.from('profiles').select('id,username,display_name,role').eq('id', session.user.id).maybeSingle();
  currentProfile = data || null;
  renderAuth();
}

async function loadUsers() {
  const { data, error } = await sb.from('profiles').select('username,display_name,role,created_at').order('created_at');
  const body = byId('userBody'); body.textContent = '';
  if (error) { setText('adminMsg', "Couldn't load the user list."); return; }
  (data || []).forEach(u => {
    const tr = document.createElement('tr');
    const added = new Date(u.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    [u.username, u.display_name, u.role, added].forEach(v => {
      const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

if (sb) {
  // Supabase restores any saved session on page load, then fires this for every sign in or out.
  // The work is deferred so no Supabase call runs inside the callback itself.
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => applySession(session), 0); });

  byId('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const username = byId('loginUser').value.trim().toLowerCase(), password = byId('loginPass').value;
    if (!username || !password) { setText('authMsg', 'Enter your username and password.'); return; }
    byId('loginBtn').disabled = true; setText('authMsg', 'Signing in…');
    const { error } = await sb.auth.signInWithPassword({ email:username + '@' + EMAIL_DOMAIN, password });
    byId('loginBtn').disabled = false;
    if (error) { setText('authMsg', 'Wrong username or password.'); return; }
    byId('loginPass').value = ''; setText('authMsg', '');
  });

  byId('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    byId('loginUser').value = ''; setText('authMsg', 'You have signed out.');
  });

  byId('accountBtn').addEventListener('click', () => {
    const panel = byId('accountPanel'); panel.hidden = !panel.hidden; setText('passMsg', '');
  });

  byId('passwordForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = byId('newPass').value;
    if (pw.length < 6) { setText('passMsg', 'Use at least 6 characters.'); return; }
    const { error } = await sb.auth.updateUser({ password:pw });
    if (error) setText('passMsg', "Couldn't change the password. Please try again.");
    else { byId('newPass').value = ''; setText('passMsg', 'Password changed.'); }
  });

  byId('addUserForm').addEventListener('submit', async e => {
    e.preventDefault();
    const body = {
      action:'create_user', username:byId('newUser').value.trim().toLowerCase(),
      display_name:byId('newName').value.trim(), password:byId('newUserPass').value, role:byId('newRole').value
    };
    setText('adminMsg', 'Adding user…');
    const { error } = await sb.functions.invoke('manage-users', { body });
    if (error) {
      let msg = "Couldn't add the user.";
      try { msg = (await error.context.json()).error || msg; } catch (err) {}
      setText('adminMsg', msg); return;
    }
    setText('adminMsg', 'User "' + body.username + '" added.');
    ['newUser', 'newName', 'newUserPass'].forEach(id => { byId(id).value = ''; });
    loadUsers();
  });
} else {
  setText('authMsg', 'Sign-in is unavailable right now. You can still play.');
  byId('loginForm').hidden = true;
}
loadBoard();

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
